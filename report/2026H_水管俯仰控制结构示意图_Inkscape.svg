<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
  width="1600"
  height="900"
  viewBox="0 0 1600 900"
  version="1.1">

  <sodipodi:namedview
    id="namedview1"
    pagecolor="#eef2f6"
    bordercolor="#2b4058"
    borderopacity="1.0"
    inkscape:showpageshadow="2"
    showgrid="false"
    inkscape:zoom="0.78"
    inkscape:cx="800"
    inkscape:cy="450"
    inkscape:document-units="px"/>

  <defs>
    <linearGradient id="gradPipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9fcff"/>
      <stop offset="0.55" stop-color="#dcecf5"/>
      <stop offset="1" stop-color="#bdd3e1"/>
    </linearGradient>
    <linearGradient id="gradSteel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#aebdca"/>
      <stop offset="0.5" stop-color="#f7fafc"/>
      <stop offset="0.78" stop-color="#7b8c9d"/>
      <stop offset="1" stop-color="#d7e0e7"/>
    </linearGradient>
    <linearGradient id="gradServo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3de"/>
      <stop offset="1" stop-color="#e9a854"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#15283b" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#15283b" flood-opacity="0.25"/>
    </filter>

    <marker id="arrowNavy" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#20364f"/>
    </marker>
    <marker id="arrowNavyStart" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#20364f"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1597b8"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d4771d"/>
    </marker>

    <style><![CDATA[
      .txt { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; fill:#20364f; }
      .title { font-size:34px; font-weight:700; letter-spacing:1px; }
      .subtitle { font-size:17px; fill:#5f7183; }
      .label { font-size:19px; font-weight:600; }
      .small { font-size:15px; }
      .tiny { font-size:13px; }
      .dim { font-size:16px; font-weight:600; }
      .outline { stroke:#20364f; stroke-width:3; stroke-linejoin:round; stroke-linecap:round; }
      .thin { stroke:#20364f; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
      .fine { stroke:#61778c; stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round; }
      .motion { fill:none; stroke:#1597b8; stroke-width:3; stroke-dasharray:12 9; stroke-linecap:round; stroke-linejoin:round; opacity:.8; }
      .motion2 { fill:none; stroke:#6aa4d7; stroke-width:3; stroke-dasharray:12 9; stroke-linecap:round; stroke-linejoin:round; opacity:.72; }
      .callout { fill:#ffffff; stroke:#9eb0c1; stroke-width:1.5; rx:10; }
    ]]></style>
  </defs>

  <!-- 01 背景与标题 -->
  <g inkscape:groupmode="layer" inkscape:label="01_背景与标题" id="layer-bg">
    <rect id="background" x="0" y="0" width="1600" height="900" fill="#f4f7fa"/>
    <rect id="sheet" x="30" y="28" width="1540" height="844" rx="18" fill="#ffffff" stroke="#d5dee7" stroke-width="2" filter="url(#shadow)"/>
    <text id="title" x="85" y="82" class="txt title">水管俯仰控制机构示意图</text>
    <text id="subtitle" x="87" y="112" class="txt subtitle">2026H 车载平衡滚球运动控制系统 · 侧视结构与运动关系</text>
    <line id="title-line" x1="85" y1="128" x2="1515" y2="128" stroke="#dbe4ec" stroke-width="2"/>
  </g>

  <!-- 02 车架与固定支撑 -->
  <g inkscape:groupmode="layer" inkscape:label="02_车架与固定支撑" id="layer-frame">
    <g id="chassis-group" filter="url(#smallShadow)">
      <rect id="chassis-top-rail" x="145" y="700" width="1310" height="24" rx="5" fill="#d9e2e9" class="outline"/>
      <rect id="chassis-main" x="88" y="723" width="1424" height="48" rx="8" fill="#aebdca" class="outline"/>
      <rect id="chassis-highlight" x="104" y="733" width="1392" height="12" rx="5" fill="#dfe7ed" opacity="0.8"/>
      <text id="label-chassis" x="1390" y="754" class="txt label">车架底板</text>
    </g>

    <g id="left-support-group">
      <rect id="support-foot" x="205" y="675" width="255" height="25" rx="3" fill="#c9d4dd" class="outline"/>
      <path id="support-post-left" d="M260 675 L260 226 L281 226 L281 675 Z" fill="#dbe4eb" class="outline"/>
      <path id="support-post-right" d="M303 675 L303 226 L324 226 L324 675 Z" fill="#dbe4eb" class="outline"/>
      <rect id="support-top-plate" x="220" y="208" width="170" height="22" rx="3" fill="#b8c7d2" class="outline"/>
      <path id="support-brace" d="M281 570 L303 570 L370 675 L344 675 Z" fill="#cbd6df" class="outline" opacity="0.9"/>
      <circle id="hinge-outer" cx="335" cy="234" r="20" fill="#f9fbfc" class="outline"/>
      <circle id="hinge-inner" cx="335" cy="234" r="8" fill="#667d91" stroke="#20364f" stroke-width="2"/>
      <path id="hinge-leaf-left" d="M292 219 H325 V249 H292 Z" fill="#c6d1da" class="thin"/>
      <path id="hinge-leaf-right" d="M345 219 H382 V249 H345 Z" fill="#c6d1da" class="thin"/>
    </g>
  </g>

  <!-- 03 水管摆杆：中位 -->
  <g inkscape:groupmode="layer" inkscape:label="03_水管摆杆_中位" id="layer-pipe-neutral">
    <g id="pipe-neutral-group" transform="rotate(0 335 234)" filter="url(#smallShadow)">
      <path id="pipe-body" d="M335 202 H1325 Q1335 202 1335 212 V279 Q1335 289 1325 289 H335 Z" fill="url(#gradPipe)" class="outline"/>
      <path id="pipe-inner-top" d="M356 222 H1312" fill="none" stroke="#8ba9bc" stroke-width="3" stroke-linecap="round"/>
      <path id="pipe-inner-bottom" d="M356 269 H1312" fill="none" stroke="#6f8ca2" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <path id="pipe-left-stop" d="M348 191 V300" stroke="#20364f" stroke-width="6" stroke-linecap="round"/>
      <path id="pipe-right-stop" d="M1320 191 V300" stroke="#20364f" stroke-width="6" stroke-linecap="round"/>
      <path id="right-lug" d="M1278 289 L1322 289 L1308 327 L1289 327 Z" fill="#becbd5" class="outline"/>
      <circle id="right-lug-pin" cx="1298" cy="313" r="9" fill="#ffffff" class="thin"/>
      <text id="label-pipe" x="715" y="255" class="txt label">PPR 半圆水管摆杆</text>
    </g>
  </g>

  <!-- 04 钢球与刻度 -->
  <g inkscape:groupmode="layer" inkscape:label="04_钢球与刻度" id="layer-ball-scale">
    <g id="scale-group">
      <line id="scale-baseline" x1="590" y1="215" x2="1070" y2="215" stroke="#7d93a6" stroke-width="1.5"/>
      <line id="tick-minus5" x1="632" y1="204" x2="632" y2="230" stroke="#20364f" stroke-width="2"/>
      <line id="tick-center" x1="830" y1="199" x2="830" y2="232" stroke="#20364f" stroke-width="2.5"/>
      <line id="tick-plus5" x1="1028" y1="204" x2="1028" y2="230" stroke="#20364f" stroke-width="2"/>
      <text id="text-minus5" x="607" y="190" class="txt small">−5 cm</text>
      <text id="text-center" x="820" y="187" class="txt small" font-weight="700">O</text>
      <text id="text-plus5" x="1005" y="190" class="txt small">+5 cm</text>
    </g>

    <g id="ball-group" filter="url(#smallShadow)">
      <circle id="ball" cx="830" cy="243" r="20" fill="url(#gradSteel)" stroke="#20364f" stroke-width="2.5"/>
      <ellipse id="ball-highlight" cx="823" cy="236" rx="7" ry="5" fill="#ffffff" opacity="0.85"/>
      <line id="ball-centerline" x1="830" y1="219" x2="830" y2="270" stroke="#476077" stroke-width="1" stroke-dasharray="4 4" opacity="0.65"/>
    </g>
  </g>

  <!-- 05 舵机与板架 -->
  <g inkscape:groupmode="layer" inkscape:label="05_舵机与板架" id="layer-servo-bracket">
    <g id="servo-bracket-group">
      <rect id="bracket-base" x="875" y="680" width="510" height="20" rx="3" fill="#aebdca" class="outline"/>
      <path id="bracket-left" d="M920 680 V505 H950 V680 Z" fill="#d8e1e7" class="outline"/>
      <path id="bracket-right" d="M1330 680 V505 H1360 V680 Z" fill="#d8e1e7" class="outline"/>
      <path id="bracket-top" d="M920 505 H1360 V530 H920 Z" fill="#d8e1e7" class="outline"/>
      <path id="bracket-brace" d="M950 650 L1030 530 H1060 L985 680 H950 Z" fill="#c7d3dc" class="outline"/>
      <text id="label-bracket" x="953" y="550" class="txt label">舵机板架</text>
    </g>

    <g id="servo-group" filter="url(#smallShadow)">
      <rect id="servo-body" x="1005" y="574" width="215" height="94" rx="10" fill="url(#gradServo)" class="outline"/>
      <rect id="servo-flange-left" x="980" y="592" width="30" height="58" rx="4" fill="#d88a30" class="thin"/>
      <rect id="servo-flange-right" x="1216" y="592" width="30" height="58" rx="4" fill="#d88a30" class="thin"/>
      <circle id="servo-mount-l1" cx="995" cy="606" r="4" fill="#20364f"/>
      <circle id="servo-mount-l2" cx="995" cy="636" r="4" fill="#20364f"/>
      <circle id="servo-mount-r1" cx="1231" cy="606" r="4" fill="#20364f"/>
      <circle id="servo-mount-r2" cx="1231" cy="636" r="4" fill="#20364f"/>
      <rect id="servo-top" x="1075" y="554" width="94" height="26" rx="7" fill="#e6a04b" class="thin"/>
      <circle id="servo-shaft" cx="1165" cy="567" r="16" fill="url(#gradSteel)" class="outline"/>
      <circle id="servo-shaft-center" cx="1165" cy="567" r="5" fill="#6a7d8e"/>
      <text id="label-servo" x="1040" y="632" class="txt label">MG90S 舵机</text>
    </g>
  </g>

  <!-- 06 连杆机构 -->
  <g inkscape:groupmode="layer" inkscape:label="06_连杆机构" id="layer-linkage">
    <g id="servo-horn-group">
      <path id="servo-horn" d="M1165 567 L1248 602" stroke="#d4771d" stroke-width="13" stroke-linecap="round"/>
      <circle id="horn-root" cx="1165" cy="567" r="10" fill="#fff8ef" stroke="#b55b12" stroke-width="3"/>
      <circle id="horn-pin" cx="1248" cy="602" r="10" fill="#ffffff" stroke="#b55b12" stroke-width="3"/>
      <text id="label-horn" x="1172" y="642" class="txt small">舵机摇臂</text>
    </g>

    <g id="pushrod-group">
      <line id="pushrod-back" x1="1248" y1="602" x2="1298" y2="313" stroke="#20364f" stroke-width="15" stroke-linecap="round"/>
      <line id="pushrod-front" x1="1248" y1="602" x2="1298" y2="313" stroke="#dfe7ed" stroke-width="9" stroke-linecap="round"/>
      <circle id="pushrod-lower-joint" cx="1248" cy="602" r="11" fill="#f9fbfc" class="outline"/>
      <circle id="pushrod-upper-joint" cx="1298" cy="313" r="11" fill="#f9fbfc" class="outline"/>
      <path id="link-force-arrow" d="M1272 465 L1284 395" fill="none" stroke="#d4771d" stroke-width="3" marker-end="url(#arrowOrange)"/>
      <text id="label-pushrod" x="1300" y="462" class="txt small" transform="rotate(-80 1300 462)">可调推杆</text>
    </g>
  </g>

  <!-- 07 运动范围与虚线演示 -->
  <g inkscape:groupmode="layer" inkscape:label="07_运动范围_虚线" id="layer-motion-range">
    <g id="pipe-up-ghost" transform="rotate(-5 335 234)" opacity="0.55">
      <path d="M335 202 H1325 Q1335 202 1335 212 V279 Q1335 289 1325 289 H335" class="motion"/>
      <path d="M348 191 V300 M1320 191 V300" class="motion"/>
    </g>
    <g id="pipe-down-ghost" transform="rotate(5 335 234)" opacity="0.52">
      <path d="M335 202 H1325 Q1335 202 1335 212 V279 Q1335 289 1325 289 H335" class="motion2"/>
      <path d="M348 191 V300 M1320 191 V300" class="motion2"/>
    </g>

    <path id="pipe-angle-arc" d="M455 224 A122 122 0 0 1 454 246" class="motion" marker-start="url(#arrowNavyStart)" marker-end="url(#arrowCyan)">
      <animate attributeName="stroke-dashoffset" from="0" to="-42" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <text id="angle-label" x="453" y="218" class="txt dim">±θ</text>

    <path id="right-end-motion-arc" d="M1260 170 A1010 1010 0 0 1 1261 344" class="motion" marker-end="url(#arrowCyan)">
      <animate attributeName="stroke-dashoffset" from="0" to="-42" dur="1.1s" repeatCount="indefinite"/>
    </path>

    <path id="horn-motion-arc" d="M1229 530 A86 86 0 0 1 1248 623" class="motion2" marker-end="url(#arrowCyan)">
      <animate attributeName="stroke-dashoffset" from="0" to="-42" dur="1.0s" repeatCount="indefinite"/>
    </path>

    <line id="link-up-ghost" x1="1235" y1="545" x2="1314" y2="229" class="motion"/>
    <line id="link-down-ghost" x1="1256" y1="623" x2="1276" y2="397" class="motion2"/>

    <text id="motion-label" x="1170" y="378" class="txt small" fill="#1597b8">水管俯仰运动范围</text>
  </g>

  <!-- 08 尺寸与引出标注 -->
  <g inkscape:groupmode="layer" inkscape:label="08_尺寸与引出标注" id="layer-dim-callout">
    <!-- 水管长度 -->
    <line id="dim-length-ext-left" x1="335" y1="202" x2="335" y2="154" class="fine"/>
    <line id="dim-length-ext-right" x1="1335" y1="202" x2="1335" y2="154" class="fine"/>
    <line id="dim-length" x1="343" y1="158" x2="1327" y2="158" stroke="#20364f" stroke-width="1.8" marker-start="url(#arrowNavyStart)" marker-end="url(#arrowNavy)"/>
    <rect id="dim-length-bg" x="695" y="142" width="280" height="31" rx="6" fill="#ffffff" opacity="0.94"/>
    <text id="dim-length-text" x="735" y="164" class="txt dim">L = 250 mm</text>

    <!-- 支撑高度 -->
    <line id="dim-height-top-ext" x1="252" y1="289" x2="168" y2="289" class="fine"/>
    <line id="dim-height-bottom-ext" x1="205" y1="700" x2="168" y2="700" class="fine"/>
    <line id="dim-height" x1="174" y1="297" x2="174" y2="692" stroke="#20364f" stroke-width="1.8" marker-start="url(#arrowNavyStart)" marker-end="url(#arrowNavy)"/>
    <rect id="dim-height-bg" x="111" y="477" width="126" height="34" rx="6" fill="#ffffff" opacity="0.94" transform="rotate(-90 174 494)"/>
    <text id="dim-height-text" x="128" y="499" class="txt dim" transform="rotate(-90 174 494)">h ≥ 50 mm</text>

    <!-- 合页引出 -->
    <path id="leader-hinge" d="M335 250 L370 330 L415 330" fill="none" class="fine" marker-end="url(#arrowNavy)"/>
    <rect id="callout-hinge-box" x="408" y="306" width="175" height="48" class="callout"/>
    <text id="callout-hinge-text" x="425" y="336" class="txt label">合页 / 转轴 H</text>

    <!-- 钢球引出 -->
    <path id="leader-ball" d="M850 235 L895 205 L1000 205" fill="none" class="fine" marker-end="url(#arrowNavy)"/>
    <rect id="callout-ball-box" x="993" y="178" width="195" height="50" class="callout"/>
    <text id="callout-ball-text" x="1010" y="209" class="txt label">钢球（约 Φ10 mm）</text>

    <!-- 连接耳引出 -->
    <path id="leader-lug" d="M1307 318 L1392 355 L1475 355" fill="none" class="fine" marker-end="url(#arrowNavy)"/>
    <rect id="callout-lug-box" x="1375" y="332" width="158" height="48" class="callout"/>
    <text id="callout-lug-text" x="1394" y="362" class="txt label">水管连接耳</text>

    <!-- 舵机控制参数 -->
    <path id="leader-servo" d="M1070 668 L1045 792 L850 792" fill="none" class="fine" marker-end="url(#arrowNavy)"/>
    <rect id="callout-servo-box" x="480" y="785" width="382" height="65" class="callout"/>
    <text id="callout-servo-text1" x="500" y="812" class="txt label">舵机控制接口</text>
    <text id="callout-servo-text2" x="500" y="838" class="txt small">TIM1_CH1 / PA8 · 50 Hz · 500–2500 μs（中位 1500 μs）</text>
  </g>

  <!-- 09 动画演示：浏览器预览时可见，Inkscape 中仍为独立对象 -->
  <g inkscape:groupmode="layer" inkscape:label="09_动画演示" id="layer-animation" opacity="0.30">
    <circle id="animated-ball-ghost" cx="632" cy="243" r="13" fill="#1597b8" stroke="#ffffff" stroke-width="3">
      <animate attributeName="cx" values="632;1028;632" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.75;0.25" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <path id="ball-motion-path" d="M632 243 H1028" class="motion2" marker-end="url(#arrowCyan)">
      <animate attributeName="stroke-dashoffset" from="0" to="-42" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <text id="ball-motion-text" x="707" y="300" class="txt small" fill="#1597b8">钢球位置变化（动态示意）</text>
  </g>

  <!-- 10 剖面、图例与说明 -->
  <g inkscape:groupmode="layer" inkscape:label="10_剖面图例与说明" id="layer-legend">
    <!-- A-A 剖面 -->
    <g id="section-aa-group">
      <rect id="section-box" x="1265" y="47" width="250" height="100" rx="12" fill="#f8fbfd" stroke="#b5c5d3" stroke-width="1.5"/>
      <text id="section-title" x="1285" y="73" class="txt small" font-weight="700">A–A 水管横截面</text>
      <path id="section-pipe" d="M1305 92 A66 66 0 0 0 1437 92" fill="none" stroke="#7ca3b7" stroke-width="16" stroke-linecap="round"/>
      <path id="section-inner" d="M1318 92 A53 53 0 0 0 1424 92" fill="none" stroke="#eef6fa" stroke-width="8" stroke-linecap="round"/>
      <circle id="section-ball" cx="1371" cy="104" r="15" fill="url(#gradSteel)" stroke="#20364f" stroke-width="2"/>
      <line id="section-center" x1="1371" y1="82" x2="1371" y2="130" stroke="#6e8193" stroke-width="1" stroke-dasharray="4 3"/>
      <text id="section-note" x="1452" y="112" class="txt tiny">半圆凹槽</text>
    </g>

    <!-- 图例 -->
    <g id="legend-group">
      <rect id="legend-box" x="895" y="785" width="620" height="65" rx="10" fill="#f8fbfd" stroke="#c6d3de" stroke-width="1.5"/>
      <line id="legend-solid-line" x1="920" y1="807" x2="975" y2="807" stroke="#20364f" stroke-width="4"/>
      <text id="legend-solid-text" x="988" y="813" class="txt small">中位 / 实体结构</text>
      <line id="legend-dash-line" x1="1125" y1="807" x2="1180" y2="807" class="motion"/>
      <text id="legend-dash-text" x="1193" y="813" class="txt small">运动范围 / 虚线轨迹</text>
      <line id="legend-orange-line" x1="1390" y1="807" x2="1435" y2="807" stroke="#d4771d" stroke-width="7" stroke-linecap="round"/>
      <text id="legend-orange-text" x="1448" y="813" class="txt small">驱动</text>
      <text id="note-text" x="920" y="839" class="txt tiny">注：结构示意不按严格比例；舵机摇臂长度、推杆孔位与机械限位需根据实物安装后校准。</text>
    </g>
  </g>
</svg>
